<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoros</title>
</head>
<body>
<div class="main">
    <div class="header">
        <div class="logo">Logo</div>
        <div class="report">Report</div>
        <div class="settings">Settings</div>
    </div>
    <div class="timer">
        <div class="container">
            <div class="pomodoros">
                <div class="pomodoro">Pomodoro</div>
                <div class="short-break">short-break</div>
                <div class="long-break">Long Break</div>
            </div>
            <div class="time">
                    <div class="timing">00:00</div>
                    <div class = "group actives">
                        <div class="active name">Pomos 0/n</div>
                        <div class="active number">#</div>
                    </div>
                    <button class="start">Start</button>
                    <button class="reset">Reset</button>
                    <button class="logtask">logtask</button>
                    <button class="switch">SwitchProject</button>
                    <button class="display">Display</button>
                    <button class="add">AddTask</button>
                    <button class="remove">RemoveTask</button>
            </div>
            <div class="pause"></div>
        </div>
        <div class="spacer"></div>    
    </div>
    <div class="task-main">
        <div class="title">
            <p>Tasks</p>
            <div></div>
        </div>
        <div class="projects"></div>
    </div>
</div>
</body>
</html>
