<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoros</title>
</head>
<body>
<div class="main">
    <div class="header">
        <div class="logo">Logo</div>
        <div class="report">Report</div>
        <div class="settings">Settings</div>
    </div>
    <div class="timer">
        <div class="container">
            <div class="pomodoros">
                <div class="pomodoro">Pomodoro</div>
                <div class="short-break">short-break</div>
                <div class="long-break">Long Break</div>
            </div>
            <div class="time">
                    <div class="timing">00:00</div>
                    <div class = "group actives">
                        <div class="active name">Pomos 0/n</div>
                        <div class="active number">#</div>
                    </div>
                    <button class="start">Start</button>
                    <button class="reset">Reset</button>
                    <button class="logtask">logtask</button>
                    <button class="switch">SwitchProject</button>
                    <button class="display">Display</button>
                    <button class="add">AddTask</button>
                    <button class="remove">RemoveTask</button>
            </div>
            <div class="pause"></div>
        </div>
        <div class="spacer"></div>    
    </div>
    <div class="task-main">
        <div class="title">
            <p>Tasks</p>
            <div></div>
        </div>
        <div class="projects"></div>
        <div class="before-form">Add a task
            <button class="add-task"> +++ </button>
        </div>
        <div class="form hidden">
            <form action="http://localhost:8080/" method="POST">
                <p>
                    <!-- <label for="task-name"></label> -->
                    <input type="text" id="task-name" name = "name", placeholder="Enter a Task Title">
                </p>
                <div class = "pomodoro area">
                    <div class = "pomodoro creation">
                        <div>
                            <!-- <label for="pomodoro"></label> -->
                            <input type="number" id="pomodoro" name = "pomodoros", placeholder="#Pomodoros">
                        </div>
                       
                            <div class="increase">+</div>
                            <div class="decrease">-</div>
                        
                    </div>
                    <div class="project-select">
                        <!-- <label for="project-select">Project:</label> -->
                        <select name="projects" id="project-select">
                            <!-- <option value=""></option> -->
                            <option value="0">Foo</option>
                            <option value="1">Bar</option>
                        </select>
                    </div> 
                </div>                
                <div class="notes-expansion">
                    <button type ="button" class="expansion">+ Add Notes</button>
                </div>
                <div class="notes hidden">
                    <!-- <label for="notes">Add Notes:</label> -->
                    <textarea name="notes" id="notes", placeholder="Lorem Ipsum"></textarea>
                </div>

            <div>
                <button type = "button" class="cancel">Cancel</button>
                <button class="submit" type="submit">Add Task</button>
            </div>
            </form>
            
        </div>
    </div>
</div>
</body>
</html>
